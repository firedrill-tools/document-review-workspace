name: check
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.1
      - working-directory: backend
        run: uv sync --locked --extra test
      - working-directory: backend
        run: uv run --locked python scripts/generate_data.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix firedrill --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix firedrill
      - working-directory: backend
        run: uv run --locked --extra test pytest -q
  frontend:
    runs-on: ubuntu-latest
    env:
      COPILOTKIT_TELEMETRY_DISABLED: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.1
      - working-directory: backend
        run: uv sync --locked --extra test
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_REVIEW_API_URL: http://127.0.0.1:38124
      - working-directory: frontend
        run: npm run test:chat

  distribution:
    runs-on: ubuntu-latest
    env:
      COPILOTKIT_TELEMETRY_DISABLED: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.1
      - working-directory: backend
        run: uv sync --locked
      - working-directory: backend
        run: uv build
      - run: uv run --project backend --locked python scripts/check_distribution.py
